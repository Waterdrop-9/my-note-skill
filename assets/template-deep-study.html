<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[笔记标题] · Deep Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<!-- Optional enhancement: keep CSS, JS and auto-render on the same pinned version. -->
<link id="math-css" onload="this.dataset.loaded = 'true'" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/katex.min.css" integrity="sha384-M59ezskvvpvT+a+C1x088YJ3DVmK+wZdX0UkVKalOI4Qi5Nwv0WrvpqHcfa2HQqB" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/katex.min.js" integrity="sha384-7jGyG5zFwmEamqNWdCbpsPn+GTWEis3lnV7X/jXHyhFpJG7ExABLyMapabg8F4+p" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
<style>
  :root {
    --paper-bg: #faf9f7;
    --surface: #ffffff;
    --ink-black: #242522;
    --ink-muted: #595c57;
    --border: #dedfd8;
    --ink-blue: #2454a4; --blue-bg: #eff4fc;
    --ink-teal: #116d66; --teal-bg: #eff9f6;
    --ink-orange: #96530e; --orange-bg: #fff7e9;
    --ink-red: #a52d32; --red-bg: #fff1f1;
    --ink-green: #226b43; --green-bg: #edf7ef;
    --ink-purple: #6941a5; --purple-bg: #f5f0fb;
    --font-title: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-code: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper-bg); color: var(--ink-black);
    font: 1rem/1.95 var(--font-body); -webkit-font-smoothing: antialiased;
  }
  .notebook { max-width: 900px; margin: 0 auto; padding: 52px 36px 96px; }
  h1, h2, h3, p, figure, pre { margin-top: 0; }
  h1, h2 { font-family: var(--font-title); line-height: 1.5; }
  h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 16px; }
  h2 { font-size: 1.55rem; margin-bottom: 22px; }
  h3 { font-size: 1.12rem; margin: 28px 0 12px; line-height: 1.65; }
  p { margin-bottom: 16px; }
  ul, ol { padding-left: 1.5rem; margin: 12px 0 20px; }
  li { margin-bottom: 6px; }
  a { color: var(--ink-blue); text-underline-offset: 4px; overflow-wrap: anywhere; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--ink-teal); outline-offset: 4px; }
  .skip-link { position: absolute; left: 12px; top: -100px; background: white; padding: 8px; }
  .skip-link:focus { top: 12px; }
  .study-header { padding: 18px 0 32px; margin-bottom: 32px; border-bottom: 2px solid var(--ink-black); }
  .eyebrow, .section-number { font: 500 .78rem/1.6 var(--font-code); color: var(--ink-blue); letter-spacing: .08em; }
  .eyebrow { margin-bottom: 18px; }
  .reading-guide, .toc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 22px 26px; margin: 26px 0; }
  .reading-guide h2, .toc h2 { font: 700 .92rem/1.6 var(--font-body); margin-bottom: 14px; }
  .reading-guide p:last-child { margin-bottom: 0; }
  .priority { display: inline-block; font: 500 .7rem/1.7 var(--font-code); padding: 2px 8px; border: 1px solid currentColor; border-radius: 4px; vertical-align: middle; }
  .priority.core { color: var(--ink-blue); background: var(--blue-bg); }
  .priority.follow-up { color: var(--ink-red); background: var(--red-bg); }
  .priority.optional { color: var(--ink-purple); background: var(--purple-bg); }
  .toc ol { columns: 2; column-gap: 32px; margin: 0; }
  .toc li { break-inside: avoid; font-size: .9rem; }
  .toc a { color: var(--ink-black); text-decoration: none; }
  .toc a:hover { color: var(--ink-blue); text-decoration: underline; }
  .section { margin-top: 54px; scroll-margin-top: 24px; }
  .section-title { border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .section-number { margin-right: 10px; }
  .content { overflow-wrap: break-word; }
  /* Existing flow / compare / code / summary hooks are reused with quiet styling. */
  .flow-box { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 24px 0; padding: 18px; border: 1px solid #bbd8d0; border-radius: 8px; background: var(--teal-bg); }
  .flow-item { flex: 1 1 120px; padding: 10px; background: var(--surface); border: 1px solid #bbd8d0; border-radius: 5px; text-align: center; font-size: .9rem; }
  .flow-arrow { color: var(--ink-teal); }
  .study-card, .compare-box, .summary-box {
    --card-accent: var(--ink-blue); --card-bg: var(--blue-bg);
    margin: 22px 0; padding: 19px 23px; border-left: 3px solid var(--card-accent);
    background: var(--card-bg); border-radius: 0 7px 7px 0;
  }
  .study-note, .study-label { --card-accent: var(--ink-blue); --card-bg: var(--blue-bg); }
  .study-note { border-left: 3px solid var(--card-accent); padding: 4px 0 4px 18px; margin: 26px 0; }
  .study-note > :last-child { margin-bottom: 0; }
  .study-label { display: inline-block; color: var(--card-accent); background: var(--card-bg); font: 700 .78rem/1.7 var(--font-body); padding: 2px 8px; border-radius: 4px; margin-right: 7px; vertical-align: baseline; }
  .card-title { color: var(--card-accent); font: 700 .88rem/1.65 var(--font-body); margin: 0 0 9px; }
  .study-card > :last-child, .compare-box > :last-child, .summary-box > :last-child { margin-bottom: 0; }
  .transition-card, .process-card { --card-accent: var(--ink-teal); --card-bg: var(--teal-bg); }
  .key-insight { --card-accent: var(--ink-orange); --card-bg: var(--orange-bg); }
  .interview-card, .misconception-card { --card-accent: var(--ink-red); --card-bg: var(--red-bg); }
  .optional-note, .derivation-note { --card-accent: var(--ink-purple); --card-bg: var(--purple-bg); }
  .solution-card { --card-accent: var(--ink-green); --card-bg: var(--green-bg); }
  .compare-row { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 16px; margin: 14px 0; }
  .compare-label { color: var(--ink-blue); font-weight: 700; }
  .process-card li { padding-left: 6px; margin-bottom: 12px; }
  .process-card li::marker { color: var(--ink-teal); font-weight: 700; }
  .formula-card { margin: 24px 0; padding: 22px; background: #f5f4ef; border: 1px solid var(--border); border-radius: 8px; }
  .formula-scroll { max-width: 100%; overflow-x: auto; padding: 8px 2px; }
  .formula-body { text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
  .formula-card figcaption { color: var(--ink-muted); font-size: .85rem; margin-top: 14px; }
  .source-figure { margin: 30px 0; }
  .figure-frame { display: block; max-width: 100%; overflow: auto; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .source-figure img, .source-figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .source-figure figcaption { color: var(--ink-muted); font-size: .85rem; margin-top: 12px; }
  .figure-credit { display: block; margin-top: 5px; }
  .katex { font-size: 1.08em; }
  .katex-display { margin: .6em 0; }
  .symbols { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 20px; margin: 20px 0; }
  .symbols dt { font-family: var(--font-code); color: var(--ink-blue); }
  .symbols dd { margin: 0 0 8px; }
  .table-scroll { max-width: 100%; overflow-x: auto; margin: 22px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  caption { text-align: left; font-weight: 700; margin-bottom: 10px; }
  th, td { text-align: left; vertical-align: top; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  thead th { color: var(--ink-blue); background: var(--blue-bg); font-size: .81rem; }
  tbody th { font-weight: 700; color: var(--ink-blue); background: var(--blue-bg); }
  .mechanism-table code, .mechanism-table .katex { white-space: nowrap; }
  tbody + tbody { border-top: 2px solid var(--border); }
  code, pre { font-family: var(--font-code); }
  code { font-size: .86em; }
  :not(pre) > code, .code-term { background: #efeee9; padding: 2px 5px; border-radius: 3px; }
  .code-block { background: #202630; color: #e1e7ef; border-radius: 8px; padding: 22px; margin: 22px 0; line-height: 1.75; overflow-x: auto; tab-size: 4; }
  .code-block code { font-size: .83rem; background: transparent; padding: 0; }
  .code-comment { color: #adb9c6; }
  .mastery { color: var(--ink-muted); font-size: .88rem; border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 24px; }
  .sources { color: var(--ink-muted); font-size: .88rem; }
  .study-footer { border-top: 2px solid var(--ink-black); margin-top: 48px; padding-top: 20px; color: var(--ink-muted); font-size: .8rem; }
  .render-notice { color: var(--ink-red); font-size: .85rem; }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    .notebook { padding: 28px 20px 64px; }
    .study-header { padding-top: 8px; }
    .section { margin-top: 40px; }
    .reading-guide, .toc, .study-card, .compare-box, .summary-box, .formula-card { padding: 17px; }
    .toc ol { columns: 1; }
    .flow-box { flex-direction: column; align-items: stretch; }
    .flow-item { flex: auto; }
    .flow-arrow { transform: rotate(90deg); align-self: center; }
    .compare-row { grid-template-columns: 1fr; gap: 4px; }
    .symbols { column-gap: 12px; font-size: .9rem; }
    .mechanism-table { min-width: 560px; }
    .table-scroll::before { content: "表格可横向滚动 →"; display: block; color: var(--ink-muted); font-size: .78rem; margin-bottom: 8px; }
    th, td { padding: 10px; }
    .code-block { padding: 17px; }
  }
  @media print {
    @page { margin: 16mm; }
    body { background: white; font-size: 10.5pt; }
    .notebook { max-width: none; padding: 0; }
    .skip-link { display: none; }
    .section { margin-top: 26px; }
    .study-footer { margin-top: 18px; padding-top: 10px; }
    h1, h2, h3, .card-title, caption { break-after: avoid; }
    p { orphans: 3; widows: 3; }
    .study-card, .formula-card, .source-figure, .compare-box, .summary-box { box-decoration-break: clone; }
    .code-block { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; color: #222; }
    .code-comment { color: #555; }
    .table-scroll, .formula-scroll { overflow: visible; }
    .mechanism-table { min-width: 0; }
    table { table-layout: fixed; }
    th, td { overflow-wrap: anywhere; padding: 7px; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
  }
  .qa-answer { margin-top: 10px; }
  .qa-answer > summary { cursor: pointer; color: var(--ink-red); font-weight: 600; width: fit-content; padding: 4px 10px; border: 1px solid currentColor; border-radius: 5px; }
  .qa-answer > summary:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: 3px; }
  .qa-answer .qa-hide, .qa-answer[open] .qa-show { display: none; }
  .qa-answer[open] .qa-hide { display: inline; }
  .qa-answer > .qa-body { margin-top: 12px; }
  .qa-answer > .qa-body > :last-child { margin-bottom: 0; }
  .qa-item + .qa-item { margin-top: 22px; }
  .qa-question { font-weight: 700; margin-bottom: 0; }
  @media print { .qa-answer > summary { display: none; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="notebook">
<!-- STUDY CONTENT START: compose sections freely; preserve semantic visual primitives, not a fixed outline. -->
<header class="study-header">
  <p class="eyebrow">DEEP STUDY / [可选领域标签]</p>
  <h1>[笔记标题]</h1>
</header>
<main id="main" class="content">
  <!-- Choose sections from the subject's real logic. A derivation, execution trace,
       comparison, source figure or continuous prose can lead; numbering and TOC are optional.
       After content QA, identify insights, misconceptions, formulas, branches, processes,
       transitions and review answers; give each important point a visible semantic anchor.
       Reuse same-meaning components; vary combinations with the content. Examples live in references.
       Keep audience assumptions, generation goals and planning metadata out of the page;
       retain reader-facing learning labels, sources and figure captions. -->
  <section class="section" id="start">
    <h2 class="section-title">[从当前主题最自然的问题、现象或证据开始]</h2>
    <p>[放入已审查正文并落实语义映射：普通解释用段落，重点用现有组件或局部标签／边线；组合随内容决定。]</p>
  </section>
  <section class="section sources" id="sources">
    <h2 class="section-title">参考资料</h2>
    <p>[列出实际使用的来源与定位；来源图在图注中同时标明原图、截取或改绘。]</p>
  </section>
</main>
<footer class="study-footer">[主题短名] · Deep Study · <a href="#main">回到正文</a></footer>
<!-- STUDY CONTENT END -->
<p id="math-status" class="render-notice" role="status" hidden>部分公式未完成增强排版，保留原始 TeX 与文字解释。请检查公式语法或资源加载后重新打开。</p>
<noscript><p class="render-notice">JavaScript 未启用：正文可读，公式保留 TeX 表达式。</p></noscript>
</div>
<script>
  // Print all answers, then restore the reader's individual disclosure states.
  let printClosedAnswers = [];
  window.addEventListener('beforeprint', function () {
    printClosedAnswers = Array.from(document.querySelectorAll('details.qa-answer:not([open])'));
    printClosedAnswers.forEach(answer => { answer.open = true; });
  });
  window.addEventListener('afterprint', function () {
    printClosedAnswers.forEach(answer => { answer.open = false; });
    printClosedAnswers = [];
  });
  document.addEventListener('DOMContentLoaded', function () {
    const main = document.querySelector('main');
    const status = document.getElementById('math-status');
    if (!main || !/\\\(|\\\[|\$\$/.test(main.textContent)) return;
    // CSS failure must not turn readable source into broken, duplicated math markup.
    if (typeof renderMathInElement !== 'function' || document.getElementById('math-css').dataset.loaded !== 'true') {
      status.hidden = false;
      return;
    }
    try {
      renderMathInElement(main, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false}
        ],
        // Auto-render catches parse errors, keeps the TeX, and calls errorCallback.
        throwOnError: true,
        trust: false,
        errorCallback: function () { status.hidden = false; }
      });
      if (main.querySelector('.katex-error')) status.hidden = false;
    } catch (error) {
      status.hidden = false;
    }
  });
</script>
</body>
</html>
